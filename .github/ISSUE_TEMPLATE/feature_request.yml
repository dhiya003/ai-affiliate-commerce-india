name: Feature request
description: Propose a user outcome or product improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: Who needs this and what should become easier or possible?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and evidence
      description: Explain the current workaround, frequency, and impact.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
      placeholder: "- [ ] …"
  - type: dropdown
    id: phase
    attributes:
      label: Likely release phase
      options:
        - Phase 1 — Core product
        - Phase 2 — Marketplace intelligence
        - Phase 3 — Performance and scale
        - Unsure
